<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F7F5">
<title>Henri — Aperçu</title>
<style>
:root{--bg:#F7F7F5;--surface:#fff;--ink:#1D1D1F;--muted:#747A7E;--line:#E5E7E8;--accent:#314A5B;--soft:#E9EFF2;--faint:#F2F5F6;--shadow:0 12px 34px rgba(49,74,91,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;padding-bottom:92px}.top{position:sticky;top:0;z-index:20;background:rgba(247,247,245,.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.05)}.topin{max-width:920px;margin:auto;padding:15px 20px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:650;letter-spacing:-.045em;color:#243946}.settings{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:36px;padding:0 13px;color:var(--accent);font-size:13px;font-weight:700}main{max-width:920px;margin:auto;padding:24px 20px 42px}.screen{display:none}.screen.active{display:block}.feature{background:var(--accent);color:#fff;border-radius:25px;padding:23px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;box-shadow:0 16px 40px rgba(49,74,91,.14)}.feature small{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#D5DEE3;font-weight:800}.feature h2{margin:6px 0 4px;font-size:26px;letter-spacing:-.035em}.feature p{margin:0;color:#DCE4E8;font-size:13px}.lightBtn{border:0;background:#fff;color:var(--accent);border-radius:14px;min-height:46px;padding:0 15px;font-weight:750}.calendarTop{margin:30px 0 11px;display:flex;align-items:center;justify-content:space-between}.calendarTop h2{margin:0;font-size:24px;letter-spacing:-.03em}.calControls{display:flex;align-items:center;gap:4px}.calNav{border:0;background:transparent;color:var(--accent);font-size:22px;width:28px;height:32px}.viewSelect{border:1px solid var(--line);background:#fff;border-radius:10px;height:34px;padding:0 9px;color:var(--accent);font-size:11px;font-weight:750}.calendar{background:#fff;border:1px solid var(--line);border-radius:21px;overflow:hidden;box-shadow:var(--shadow)}.week{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}.day{border:0;border-right:1px solid var(--line);background:#fff;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted)}.day:last-child{border-right:0}.day span{font-size:9px;font-weight:800;text-transform:uppercase}.day strong{font-size:17px;color:var(--ink)}.day.active{background:var(--faint);color:var(--accent)}.day.active strong{color:var(--accent)}.events{padding:8px}.event{width:100%;border:0;background:#fff;border-radius:12px;min-height:44px;display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:center;text-align:left;padding:0 9px}.event span{font-size:11px;color:var(--muted)}.event strong{font-size:13px}.chev{color:#A0A6A9;font-size:20px}.pageHead{margin:4px 0 20px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:800}.pageHead h1{margin:7px 0 0;font-size:42px;letter-spacing:-.05em;line-height:1}.planning{display:grid;gap:10px}.planChoice{width:100%;border:1px solid var(--line);background:#fff;border-radius:20px;padding:17px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:left;box-shadow:var(--shadow)}.planChoice small{display:block;color:var(--accent);font-size:10px;text-transform:uppercase;font-weight:800;letter-spacing:.07em;margin-bottom:4px}.planChoice h3{margin:0 0 3px;font-size:19px}.planChoice p{margin:0;color:var(--muted);font-size:13px}.toolGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tool{border:1px solid var(--line);background:#fff;border-radius:20px;padding:18px;text-align:left;min-height:126px;box-shadow:var(--shadow)}.tool small{color:var(--accent);font-size:10px;text-transform:uppercase;font-weight:800}.tool h3{margin:27px 0 4px;font-size:19px}.tool p{margin:0;color:var(--muted);font-size:12px}.back{border:0;background:transparent;color:var(--accent);padding:4px 0 13px;font-weight:750}.sessionTop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:15px}.sessionTop h1{margin:4px 0 0;font-size:36px;letter-spacing:-.045em}.generateAll{border:0;background:var(--accent);color:#fff;border-radius:13px;min-height:42px;padding:0 13px;font-weight:750;font-size:12px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.field{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}.field label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800;margin-bottom:5px}.field select,.field input{width:100%;border:0;background:transparent;color:var(--ink);outline:0;font-weight:650;font-size:13px}.objective{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:10px}.objective label{display:block;color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;margin-bottom:7px}.objective input{width:100%;border:0;outline:0;font-size:15px;font-weight:650}.blocks{display:grid;gap:8px}.block{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px}.blockHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.blockTitle{font-size:15px;font-weight:750}.blockActions{display:flex;gap:5px}.mini{border:0;background:var(--faint);color:var(--accent);border-radius:9px;min-height:31px;padding:0 9px;font-size:10px;font-weight:750}.blockContent{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.35}.blockContent.empty{font-style:italic;color:#A0A5A8}.blockMenu{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);grid-template-columns:repeat(3,1fr);gap:6px}.block.open .blockMenu{display:grid}.choice{border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:10px;min-height:37px;font-size:11px;font-weight:750}.addBlock{width:100%;margin-top:9px;border:1px dashed #C9CED1;background:transparent;color:var(--accent);border-radius:15px;min-height:46px;font-weight:750}.saveBar{margin-top:15px;display:grid;grid-template-columns:1fr auto;gap:8px}.save{border:0;background:var(--accent);color:#fff;border-radius:14px;min-height:48px;font-weight:800}.more{border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:14px;min-width:48px;font-weight:800}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);border-top:1px solid rgba(0,0,0,.07);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}.bottomin{max-width:540px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.nav{border:0;background:transparent;color:#8B9296;border-radius:13px;min-height:52px;font-size:11px;font-weight:750}.nav.active{background:var(--faint);color:var(--accent)}.modal{position:fixed;inset:0;z-index:60;background:rgba(20,27,31,.28);display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(620px,100%);background:var(--bg);border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -16px 50px rgba(0,0,0,.12)}.sheet h3{margin:0 0 12px;font-size:20px}.bankItem{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;text-align:left;margin-top:7px}.bankItem strong{display:block;font-size:14px}.bankItem span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.close{float:right;border:0;background:var(--soft);color:var(--accent);border-radius:999px;width:32px;height:32px;font-weight:800}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(15px);background:#1D1D1F;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:80}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:620px){main{padding:20px 16px 34px}.feature{grid-template-columns:1fr;padding:20px}.feature .lightBtn{width:100%}.toolGrid{grid-template-columns:1fr 1fr}.sessionTop{align-items:center}.sessionTop h1{font-size:31px}.generateAll{padding:0 10px}.meta{grid-template-columns:1fr 1fr}.blockMenu{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="topin"><div class="brand">Henri</div><button class="settings" data-go="settings">⚙︎&nbsp; Paramètres</button></div></header>
<main>
<section id="home" class="screen active">
  <div class="feature"><div><small>Prochain cours</small><h2>Secondaire 3 · Ultimate</h2><p>70 min · Se démarquer pour offrir une option de passe</p></div><button class="lightBtn" id="openNext">Ouvrir</button></div>
  <div class="calendarTop"><h2>Mon calendrier</h2><div class="calControls"><button class="calNav">‹</button><button class="calNav">›</button><select class="viewSelect"><option>Semaine</option><option>Mois</option></select></div></div>
  <div class="calendar"><div class="week"><button class="day"><span>Lun</span><strong>21</strong></button><button class="day"><span>Mar</span><strong>22</strong></button><button class="day"><span>Mer</span><strong>23</strong></button><button class="day"><span>Jeu</span><strong>24</strong></button><button class="day active"><span>Ven</span><strong>25</strong></button></div><div class="events"><button class="event"><span>8 h 35</span><strong>Sec. 3 · Ultimate</strong><b class="chev">›</b></button><button class="event"><span>13 h 10</span><strong>Sec. 2 · Conditionnement</strong><b class="chev">›</b></button></div></div>
</section>
<section id="plan" class="screen"><div class="pageHead"><div class="eyebrow">Planifier</div><h1>Planifier.</h1></div><div class="planning"><button class="planChoice" id="newSession"><div><small>1 cours</small><h3>Planifier une séance</h3><p>Préparer un cours précis.</p></div><b class="chev">›</b></button><button class="planChoice demo"><div><small>Plusieurs cours</small><h3>Planifier une séquence</h3><p>Construire une progression complète.</p></div><b class="chev">›</b></button><button class="planChoice demo"><div><small>Vue globale</small><h3>Planifier l’année</h3><p>Choisir l’ordre des séquences dans l’agenda.</p></div><b class="chev">›</b></button></div></section>
<section id="tools" class="screen"><div class="pageHead"><div class="eyebrow">Outils</div><h1>Outils.</h1></div><div class="toolGrid"><button class="tool demo"><small>Séance</small><h3>Musculation</h3><p>Circuits et rotations.</p></button><button class="tool demo"><small>Répartition</small><h3>Gestion d’équipes</h3><p>Équipes équilibrées.</p></button><button class="tool demo"><small>Compétition</small><h3>Tournoi</h3><p>Horaire et résultats.</p></button><button class="tool demo"><small>Temps</small><h3>Chrono</h3><p>Compte à rebours.</p></button></div></section>
<section id="settings" class="screen"><button class="back" data-go="home">← Accueil</button><div class="pageHead"><div class="eyebrow">Paramètres</div><h1>Mes groupes.</h1></div><div class="planning"><button class="planChoice demo"><div><h3>Groupes & listes de classe</h3><p>5 groupes · PDF des élèves</p></div><b class="chev">›</b></button><button class="planChoice demo"><div><h3>Calendrier scolaire & cycle</h3><p>Calendrier et jours-cycle</p></div><b class="chev">›</b></button><button class="planChoice demo"><div><h3>Horaire enseignant</h3><p>PDF de l’horaire maître</p></div><b class="chev">›</b></button></div></section>
<section id="session" class="screen">
  <button class="back" data-go="plan">← Planifier</button>
  <div class="sessionTop"><div><div class="eyebrow">Nouvelle séance</div><h1>Ma séance</h1></div><button class="generateAll" id="generateAll">✦ Générer</button></div>
  <div class="meta"><div class="field"><label>Groupe</label><select><option>Secondaire 3 · Groupe 32</option><option>Secondaire 2 · Groupe 22</option><option>Secondaire 4 · Groupe 41</option></select></div><div class="field"><label>Date</label><input type="date" value="2026-09-28"></div></div>
  <div class="objective"><label>Objectif du cours</label><input id="objective" placeholder="Ex. Se démarquer pour offrir une option de passe"></div>
  <div class="blocks" id="blocks"></div>
  <button class="addBlock" id="addBlock">＋ Ajouter une section</button>
  <div class="saveBar"><button class="save" id="saveSession">Enregistrer dans le calendrier</button><button class="more">•••</button></div>
</section>
</main>
<nav class="bottom"><div class="bottomin"><button class="nav active" data-go="home">Accueil</button><button class="nav" data-go="plan">Planifier</button><button class="nav" data-go="tools">Outils</button></div></nav>
</div>
<div class="modal" id="modal"><div class="sheet"><button class="close" id="closeModal">×</button><h3 id="modalTitle">Banque</h3><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const screens=[...document.querySelectorAll('.screen')];
function go(id){screens.forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.go===id));window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
document.getElementById('newSession').onclick=()=>go('session');
const initial=[['Échauffement',''],['Éducatif 1',''],['Éducatif 2','Progression de l’éducatif 1'],['Situation de partie',''],['Retour au calme','Optionnel']];
const samples={
'Échauffement':['Passe et suit en mouvement','Jeu des portes en duo','Conservation 3 contre 1'],
'Éducatif 1':['Démarquage dans un corridor','Passe et déplacement vers l’espace libre','Appui-soutien en 3 contre 1'],
'Éducatif 2':['3 contre 2 avec zones à atteindre','Conservation 4 contre 2 avec progression','Jeu à 4 zones avec défense active'],
'Situation de partie':['Match 4 contre 4 · bonus après démarquage','Match à zones · point après 5 passes','Match réduit avec contraintes évolutives'],
'Retour au calme':['Retour verbal rapide + mobilité','Marche et respiration','Bilan éclair du groupe']};
function render(){const box=document.getElementById('blocks');box.innerHTML='';initial.forEach((x,i)=>{const el=document.createElement('div');el.className='block';el.innerHTML=`<div class="blockHead"><div class="blockTitle">${x[0]}</div><div class="blockActions"><button class="mini" data-toggle>＋</button><button class="mini" data-remove>×</button></div></div><div class="blockContent ${x[1]?'':'empty'}">${x[1]||'Ajouter du contenu'}</div><div class="blockMenu"><button class="choice" data-write>Écrire</button><button class="choice" data-bank>Banque</button><button class="choice" data-gen>✦ Générer</button></div>`;el.querySelector('[data-toggle]').onclick=()=>el.classList.toggle('open');el.querySelector('[data-remove]').onclick=()=>{initial.splice(i,1);render()};el.querySelector('[data-write]').onclick=()=>{const t=prompt('Contenu de la section',x[1]||'');if(t!==null){x[1]=t;render()}};el.querySelector('[data-bank]').onclick=()=>openBank(x[0],i);el.querySelector('[data-gen]').onclick=()=>{const a=samples[x[0]]||['Activité proposée par Henri'];x[1]=a[Math.floor(Math.random()*a.length)];render();toast('Proposition générée')};box.appendChild(el)})}
function openBank(type,index){document.getElementById('modalTitle').textContent=type+' · Banque';const list=samples[type]||['Activité libre'];document.getElementById('modalBody').innerHTML=list.map(v=>`<button class="bankItem"><strong>${v}</strong><span>Toucher pour choisir</span></button>`).join('');[...document.querySelectorAll('.bankItem')].forEach((b,j)=>b.onclick=()=>{initial[index][1]=list[j];render();closeModal()});document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}document.getElementById('closeModal').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
document.getElementById('addBlock').onclick=()=>{initial.push(['Nouvelle section','']);render()};
document.getElementById('generateAll').onclick=()=>{if(!document.getElementById('objective').value)document.getElementById('objective').value='Se démarquer pour offrir une option de passe';initial.forEach(x=>{const a=samples[x[0]];if(a)x[1]=a[0]});render();toast('Séance générée')};
document.getElementById('saveSession').onclick=()=>toast('Séance ajoutée au calendrier');
document.querySelectorAll('.demo').forEach(b=>b.onclick=()=>toast('Prochaine étape du prototype'));
document.querySelectorAll('.event,#openNext').forEach(b=>b.onclick=()=>toast('La séance s’ouvrira directement ici'));
document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{document.querySelectorAll('.day').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),1700)}render();
</script>
</body></html>
